<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, sans-serif">
  <rect width="900" height="520" fill="#0e1118"/>
  <text x="450" y="32" text-anchor="middle" fill="#dce1ee" font-size="15" font-weight="bold">Figure 1 — System Architecture: Ten-Stage Integrated Pipeline</text>

  <!-- Stage boxes -->
  <!-- Stage 1: Telemetry -->
  <rect x="30" y="70" width="120" height="56" rx="6" fill="#131820" stroke="#1d2334" stroke-width="1.5"/>
  <text x="90" y="93" text-anchor="middle" fill="#7e8aa0" font-size="9" font-weight="bold">STAGE 1</text>
  <text x="90" y="108" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">Telemetry</text>
  <text x="90" y="120" text-anchor="middle" fill="#7e8aa0" font-size="9">5 raw metrics</text>

  <!-- Arrow -->
  <line x1="150" y1="98" x2="178" y2="98" stroke="#1d2334" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 2: Anomaly Detection -->
  <rect x="178" y="70" width="120" height="56" rx="6" fill="#131820" stroke="#22c55e" stroke-width="1.5"/>
  <text x="238" y="93" text-anchor="middle" fill="#22c55e" font-size="9" font-weight="bold">STAGE 2</text>
  <text x="238" y="108" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">Anomaly</text>
  <text x="238" y="120" text-anchor="middle" fill="#7e8aa0" font-size="9">Isolation Forest</text>

  <!-- Arrow -->
  <line x1="298" y1="98" x2="326" y2="98" stroke="#1d2334" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 3: Temporal Buffer -->
  <rect x="326" y="70" width="120" height="56" rx="6" fill="#131820" stroke="#4b8eff" stroke-width="1.5"/>
  <text x="386" y="93" text-anchor="middle" fill="#4b8eff" font-size="9" font-weight="bold">STAGE 3</text>
  <text x="386" y="108" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">Temporal</text>
  <text x="386" y="120" text-anchor="middle" fill="#7e8aa0" font-size="9">10-step buffer</text>

  <!-- Arrow -->
  <line x1="446" y1="98" x2="474" y2="98" stroke="#1d2334" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 4: Feature Extraction -->
  <rect x="474" y="70" width="120" height="56" rx="6" fill="#131820" stroke="#9b8cff" stroke-width="1.5"/>
  <text x="534" y="93" text-anchor="middle" fill="#9b8cff" font-size="9" font-weight="bold">STAGE 4</text>
  <text x="534" y="108" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">Features</text>
  <text x="534" y="120" text-anchor="middle" fill="#7e8aa0" font-size="9">45 temporal features</text>

  <!-- Arrow -->
  <line x1="594" y1="98" x2="622" y2="98" stroke="#1d2334" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 5: Prediction -->
  <rect x="622" y="70" width="120" height="56" rx="6" fill="#131820" stroke="#9b8cff" stroke-width="1.5"/>
  <text x="682" y="93" text-anchor="middle" fill="#9b8cff" font-size="9" font-weight="bold">STAGE 5</text>
  <text x="682" y="108" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">Prediction</text>
  <text x="682" y="120" text-anchor="middle" fill="#7e8aa0" font-size="9">Logistic Regression</text>

  <!-- Arrow down from Stage 5 -->
  <line x1="682" y1="126" x2="682" y2="180" stroke="#1d2334" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 6: XAI -->
  <rect x="622" y="180" width="120" height="56" rx="6" fill="#131820" stroke="#4b8eff" stroke-width="1.5"/>
  <text x="682" y="203" text-anchor="middle" fill="#4b8eff" font-size="9" font-weight="bold">STAGE 6</text>
  <text x="682" y="218" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">XAI</text>
  <text x="682" y="230" text-anchor="middle" fill="#7e8aa0" font-size="9">Coeff. attribution</text>

  <!-- Arrow left from Stage 6 -->
  <line x1="622" y1="208" x2="594" y2="208" stroke="#1d2334" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 7: Root Cause -->
  <rect x="474" y="180" width="120" height="56" rx="6" fill="#131820" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="534" y="203" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="bold">STAGE 7</text>
  <text x="534" y="218" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">Root Cause</text>
  <text x="534" y="230" text-anchor="middle" fill="#7e8aa0" font-size="9">Evidence scoring</text>

  <!-- Arrow left from Stage 7 -->
  <line x1="474" y1="208" x2="446" y2="208" stroke="#1d2334" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 8: Decision -->
  <rect x="326" y="180" width="120" height="56" rx="6" fill="#131820" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="386" y="203" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="bold">STAGE 8</text>
  <text x="386" y="218" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">Decision</text>
  <text x="386" y="230" text-anchor="middle" fill="#7e8aa0" font-size="9">Rule-based engine</text>

  <!-- Arrow left from Stage 8 -->
  <line x1="326" y1="208" x2="298" y2="208" stroke="#1d2334" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 9: Healing -->
  <rect x="178" y="180" width="120" height="56" rx="6" fill="#131820" stroke="#ef4444" stroke-width="1.5"/>
  <text x="238" y="203" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="bold">STAGE 9</text>
  <text x="238" y="218" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">Simulated Heal</text>
  <text x="238" y="230" text-anchor="middle" fill="#7e8aa0" font-size="9">Recovery action</text>

  <!-- Arrow left from Stage 9 -->
  <line x1="178" y1="208" x2="150" y2="208" stroke="#1d2334" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 10: Verification -->
  <rect x="30" y="180" width="120" height="56" rx="6" fill="#131820" stroke="#22c55e" stroke-width="1.5"/>
  <text x="90" y="203" text-anchor="middle" fill="#22c55e" font-size="9" font-weight="bold">STAGE 10</text>
  <text x="90" y="218" text-anchor="middle" fill="#dce1ee" font-size="11" font-weight="bold">Verification</text>
  <text x="90" y="230" text-anchor="middle" fill="#7e8aa0" font-size="9">Model re-eval</text>

  <!-- Legend -->
  <rect x="30" y="290" width="840" height="110" rx="6" fill="#131820" stroke="#1d2334" stroke-width="1"/>
  <text x="450" y="312" text-anchor="middle" fill="#7e8aa0" font-size="10" font-weight="bold">COMPONENT LEGEND</text>
  <rect x="60" y="325" width="12" height="12" rx="2" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="80" y="335" fill="#dce1ee" font-size="10">Anomaly Detection / Verification (Isolation Forest · LR re-evaluation)</text>
  <rect x="60" y="347" width="12" height="12" rx="2" fill="none" stroke="#4b8eff" stroke-width="1.5"/>
  <text x="80" y="357" fill="#dce1ee" font-size="10">Temporal Processing (10-step buffer · 45 features)</text>
  <rect x="60" y="369" width="12" height="12" rx="2" fill="none" stroke="#9b8cff" stroke-width="1.5"/>
  <text x="80" y="379" fill="#dce1ee" font-size="10">AI Prediction + XAI (Logistic Regression · Coefficient Attribution)</text>
  <rect x="450" y="325" width="12" height="12" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="335" fill="#dce1ee" font-size="10">Decision Intelligence (Evidence Scoring · Rule Engine)</text>
  <rect x="450" y="347" width="12" height="12" rx="2" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="470" y="357" fill="#dce1ee" font-size="10">Simulated Recovery (NOT real cloud orchestration)</text>

  <!-- Note at bottom -->
  <text x="450" y="430" text-anchor="middle" fill="#424d65" font-size="10" font-style="italic">All stages implemented in Python/Flask. Recovery actions are simulated string selections, not cloud API calls.</text>
  <text x="450" y="445" text-anchor="middle" fill="#424d65" font-size="10" font-style="italic">Post-healing verification re-evaluates synthetic normal telemetry using the same trained Logistic Regression model.</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1d2334"/>
    </marker>
  </defs>
</svg>
